<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; connect-src 'self' http://127.0.0.1:8787; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
/>
<title>Maple</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="statusbar">
      <span id="status-dot" class="dot starting"></span>
      <span id="status-text">Starting up…</span>
    </header>

    <main id="chat">
      <div id="empty-state">
        <h1>Maple</h1>
        <p class="empty-sub">A local agent with tools and memory. Nothing leaves your machine.</p>
        <div id="examples">
          <button class="example" data-prompt="What tools do you have available right now?">
            What tools do you have available?
          </button>
          <button class="example" data-prompt="Search the web for the latest news on local LLMs and summarize it.">
            Search the web and summarize
          </button>
          <button class="example" data-prompt="Remember that I prefer concise answers.">
            Remember something about me
          </button>
        </div>
      </div>
      <div id="messages"></div>
    </main>

    <footer id="composer">
      <textarea
        id="input"
        placeholder="Message Maple…"
        rows="1"
        autofocus
      ></textarea>
      <div id="composer-actions">
        <button id="stop-btn" class="icon-btn" title="Stop" hidden>Stop</button>
        <button id="send-btn" class="icon-btn primary" title="Send">Send</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
